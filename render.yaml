services:
  - type: web
    name: pei-api
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.8"
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"
      - key: SANDBOX_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true


