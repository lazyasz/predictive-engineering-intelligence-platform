services:
  - type: web
    name: pei-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"
      - key: SANDBOX_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true

